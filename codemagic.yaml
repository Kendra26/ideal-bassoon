workflows:
  torrent-upload:
    name: Torrent Download (libtorrent - Max 10 Concurrent) & Pixeldrain (macOS)
    environment:
      vars:
        FILEMIRAGE_API_TOKEN: '0bfe0b11-611d-4bb3-9b4c-36dbaa5a1fd5'
        FOLDER_PATH: 'downloaded_files'
        LINK_FETCH_URL: 'https://pink-script-snap.lovable.app/api/public/page/9c91e8a6-e112-4b0a-9afb-45ab37c314dd.txt'
        KILL_SWITCH_URL: 'https://pink-script-snap.lovable.app/api/public/page/9c91e8a6-e112-4b0a-9afb-45ab37c314dd.txt'
    
    scripts:
      - name: Install dependencies (Homebrew & Pip)
        script: |
          brew install p7zip jq curl python3
          pip3 install libtorrent requests

      - name: Download torrent content with Python Libtorrent (Max 10 Concurrent) & Live Stats
        script: |
          python3 - << 'EOF'
          import libtorrent as lt
          import time, os, requests
          from datetime import datetime

          ses = lt.session()
          ses.listen_on(6881, 6891)
          
          settings = ses.get_settings()
          settings['active_downloads'] = 10
          settings['active_limit'] = 25
          ses.apply_settings(settings)

          save_path = os.environ.get("FOLDER_PATH", "downloaded_files")
          os.makedirs(save_path, exist_ok=True)

          link_url = os.environ.get("LINK_FETCH_URL")
          kill_url = os.environ.get("KILL_SWITCH_URL")

          added_links = set()

          def fmt_eta(sec):
              if sec is None or sec < 0 or sec >= 8640000: return "∞"
              m, s = divmod(int(sec), 60); h, m = divmod(m, 60)
              return f"{h}h {m}m {s}s" if h else (f"{m}m {s}s" if m else f"{s}s")

          print("Starting native libtorrent loop with max 10 concurrent downloads, live stats, and kill switch...", flush=True)
          update_count = 0

          while True:
              update_count += 1
              timestamp = datetime.now().strftime("%H:%M:%S")

              # 1. Check Kill Switch
              if kill_url:
                  try:
                      k_res = requests.get(kill_url, timeout=10).text
                      if "STOP.ALL.TORRENTS" in k_res:
                          print(f"\n🛑 [Global Kill Switch] Activated! | {timestamp}", flush=True)
                          break

                      kill_targets = [line.replace(' NO', '').strip().lower() for line in k_res.splitlines() if line.endswith(' NO') and line.strip()]
                      if kill_targets:
                          for h in ses.get_torrents():
                              st = h.status()
                              name = st.name.lower()
                              if any(kt in name for kt in kill_targets if kt):
                                  print(f"🛑 Killing specific target: {st.name}", flush=True)
                                  ses.remove_torrent(h, lt.options_t.delete_files)
                  except Exception as e:
                      pass

              # 2. Fetch & Add New Links
              if link_url:
                  try:
                      l_res = requests.get(link_url, timeout=10).text
                      for link in l_res.splitlines():
                          link = link.strip()
                          if link and not link.startswith('#') and link not in added_links:
                              print(f"📥 Adding link: {link[:60]}...", flush=True)
                              params = {
                                  'save_path': save_path,
                                  'storage_mode': lt.storage_mode_t.storage_mode_sparse
                              }
                              if link.startswith('magnet:'):
                                  lt.add_magnet_uri(ses, link, params)
                              elif link.startswith('http'):
                                  tor_data = requests.get(link).content
                                  with open('temp.torrent', 'wb') as tf: tf.write(tor_data)
                                  info = lt.torrent_info('temp.torrent')
                                  ses.add_torrent({'ti': info, 'save_path': save_path})
                                  os.remove('temp.torrent')
                              added_links.add(link)
                  except Exception as e:
                      pass

              # 3. Track Status & Progress
              torrents = ses.get_torrents()
              if not torrents:
                  print("📥 Waiting for active torrents...", flush=True)
              else:
                  incomplete = 0
                  print(f"\n" + "="*70, flush=True)
                  print(f"🔄 [Libtorrent-Pixeldrain] Progress Update #{update_count} | {timestamp}", flush=True)
                  print("-" * 70, flush=True)
                  
                  for h in torrents:
                      st = h.status()
                      name = st.name if st.has_metadata else "Downloading Metadata..."
                      prog = int(st.progress * 100)
                      speed_mb = st.download_rate / (1024 * 1024)
                      eta_sec = st.eta if hasattr(st, 'eta') else -1
                      
                      print(f"📥 Torrent: {name} | {prog}% | Speed: {speed_mb:.2f} MB/s | ETA: {fmt_eta(eta_sec)}", flush=True)
                      if not st.is_finished:
                          incomplete += 1
                  
                  print("=" * 70 + "\n", flush=True)
                  if incomplete == 0:
                      print("✅ All downloads finished!", flush=True)
                      break

              time.sleep(10)
          EOF

      - name: Smart Native Zipping & Splitting (Auto-Group Logic)
        script: |
          python3 - << 'EOF'
          import os, shutil, subprocess, glob, re
          from collections import defaultdict

          folder = os.environ.get("FOLDER_PATH", "downloaded_files")
          video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
          media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
          max_bytes = 5900 * 1024 * 1024

          def get_dir_size(p):
              return sum(os.path.getsize(os.path.join(dp, f)) for dp, _, fn in os.walk(p) for f in fn)

          def create_7z_group(group_name, file_paths, base_dir, max_bytes_limit):
              group_dir = os.path.join(base_dir, group_name)
              os.makedirs(group_dir, exist_ok=True)
              
              files_to_move = list(file_paths)
              for p in file_paths:
                  base_stem = os.path.splitext(p)[0]
                  for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                      sub_file = base_stem + sub_ext
                      if os.path.exists(sub_file) and sub_file not in files_to_move:
                          files_to_move.append(sub_file)

              for p in files_to_move:
                  dst = os.path.join(group_dir, os.path.basename(p))
                  if p != dst and not os.path.exists(dst):
                      shutil.move(p, dst)
              
              folder_size = get_dir_size(group_dir)
              zip_name = f"{group_name}.zip"
              orig = os.getcwd()
              os.chdir(base_dir)
              cmd = ["7z", "a", "-mx0", zip_name, group_name]
              if folder_size > max_bytes_limit:
                  cmd.insert(2, "-v5900m")
              subprocess.run(cmd, check=True)
              os.chdir(orig)
              shutil.rmtree(group_dir)

          print("Starting Auto-Group ZIP & Split handling...", flush=True)

          # RULE 4: Pre-Existing Folders with > 3 videos
          if os.path.exists(folder):
              for item in os.listdir(folder):
                  item_path = os.path.join(folder, item)
                  if os.path.isdir(item_path):
                      vids = [
                          os.path.join(r, f) for r, _, files in os.walk(item_path)
                          for f in files if f.lower().endswith(video_ext)
                      ]
                      if len(vids) > 3:
                          print(f"📦 RULE 4 (Folder > 3 videos): Zipping {item}", flush=True)
                          folder_size = get_dir_size(item_path)
                          orig = os.getcwd()
                          os.chdir(folder)
                          zip_name = f"{item}.zip"
                          cmd = ["7z", "a", "-mx0", zip_name, item]
                          if folder_size > max_bytes:
                              cmd.insert(2, "-v5900m")
                          subprocess.run(cmd, check=True)
                          os.chdir(orig)
                          shutil.rmtree(item_path)

          # Collect remaining videos for Rules 2 & 3
          remaining_videos = []
          for r, _, files in os.walk(folder):
              for f in files:
                  if f.lower().endswith(video_ext):
                      remaining_videos.append(os.path.join(r, f))

          # RULE 2: Series Grouping by Season (>3 episodes)
          series_regex = re.compile(r'(?i)^(.*?)[.\s_-]+S(\d{1,2})(?:[EX\-]|\b)')
          def clean_series_name(raw_name):
              return re.sub(r'(?i)(www\.[^\s]+\s*-\s*|^\[.*?\]\s*)', '', raw_name).strip('. -_')

          series_groups = defaultdict(list)
          for vid_path in remaining_videos:
              vid_name = os.path.basename(vid_path)
              parent_name = os.path.basename(os.path.dirname(vid_path))
              match = series_regex.search(vid_name) or series_regex.search(parent_name)
              if match:
                  s_name = clean_series_name(match.group(1))
                  s_num = match.group(2)
                  group_key = f"{s_name.lower()}_S{s_num}"
                  series_groups[group_key].append(vid_path)

          for group_key, vids in series_groups.items():
              if len(vids) > 3:
                  first_stem = os.path.splitext(os.path.basename(vids[0]))[0]
                  print(f"📦 RULE 2 (Series > 3 eps): Grouping {len(vids)} episodes into {first_stem}.zip", flush=True)
                  create_7z_group(first_stem, vids, folder, max_bytes)
                  for v in vids:
                      if v in remaining_videos:
                          remaining_videos.remove(v)

          # RULE 3: The Leftovers (>3 loose videos)
          if len(remaining_videos) > 3:
              first_stem = os.path.splitext(os.path.basename(remaining_videos[0]))[0]
              print(f"📦 RULE 3 (Leftovers > 3 videos): Grouping {len(remaining_videos)} videos into {first_stem}.zip", flush=True)
              create_7z_group(first_stem, remaining_videos, folder, max_bytes)
              remaining_videos.clear()

          # RULE 1: Standalone Items (Flatten structure, keeping standalone videos raw)
          for r, dirs, files in os.walk(folder, topdown=False):
              if r == folder: continue
              for f in files:
                  if f.lower().endswith(media_ext):
                      src = os.path.join(r, f)
                      dst = os.path.join(folder, f)
                      if not os.path.exists(dst): 
                          shutil.move(src, dst)
              shutil.rmtree(r, ignore_errors=True)
          EOF

      - name: Upload files to Pixeldrain
        script: |
          TOKEN="$FILEMIRAGE_API_TOKEN"
          FOLDER="$FOLDER_PATH"

          find "$FOLDER" -type f | sort | while read -r FILE; do
              if [[ "$FILE" == *".part"* ]]; then continue; fi
              FILENAME=$(basename "$FILE")
              
              # Safe file size calculation using python for special chars
              FILE_SIZE_MB=$(python3 -c "import os; print(f'{os.path.getsize(r\"$FILE\")/1024/1024:.2f}')")
              echo "⬆️ Uploading: $FILENAME ($FILE_SIZE_MB MB)"

              # Pixeldrain API upload via curl (Supports special characters, spaces, and token auth)
              RESPONSE=$(curl -s -u ":$TOKEN" -T "$FILE" "https://pixeldrain.com/api/file/$FILENAME")

              if echo "$RESPONSE" | jq -e . >/dev/null 2>&1; then
                  success=$(echo "$RESPONSE" | jq -r '.success')
                  if [ "$success" != "true" ]; then 
                      echo "❌ Failed: $FILENAME -> $RESPONSE"
                  else 
                      file_id=$(echo "$RESPONSE" | jq -r '.id')
                      echo "✅ Uploaded Successfully! ID: $file_id (https://pixeldrain.com/u/$file_id)"
                  fi
              else
                  echo "❌ Invalid JSON response: $RESPONSE"
              fi
          done
